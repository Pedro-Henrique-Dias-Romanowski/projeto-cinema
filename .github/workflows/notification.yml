name: notification.yml
on:
    push:
        branches:
        - main
jobs:
    notify:
        runs-on: ubuntu-latest
        steps:
          - name: Discord Commits
            uses: Sniddl/discord-commits@v1.8
            with:
              webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
              template: "avatar-with-link"
              include-extras: true
